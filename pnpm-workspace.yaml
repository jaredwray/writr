minimumReleaseAge: 10080 # 7 days, in minutes
minimumReleaseAgeStrict: true # fail instead of falling back to a too-new version
minimumReleaseAgeIgnoreMissingTime: false # missing publish-time metadata fails closed
# zod 4.6.6 (2026-10-11) and 4.6.7 (2026-10-12) fix AIKIDO-2026-143019 and are
# still inside the 7-day cooldown. Exact-version exception only; drop after 2026-10-19.
# @jaredwray/fumanchu 4.7.5 (published 2026-10-26) depends on markdown-it ^15.0.3,
# which fixes CVE-2026-111758. It is still inside the 7-day cooldown.
# Exact-version exception only; drop after 2026-11-02.
minimumReleaseAgeExclude:
  - zod@4.6.6
  - zod@4.6.7
  - "@jaredwray/fumanchu@4.7.5"
blockExoticSubdeps: true
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
trustPolicy: no-downgrade # fail if a later version has weaker trust evidence

# Pin katex to 0.18.7 (AIKIDO-2026-293837 lineage). rehype-katex@7.0.1 declares
# ^0.16.0, which never reaches 0.18.x; keep the Rust vendor in lockstep.
# Pin property-information to 7.2.0 so rehype/hast and writr-rs codegen share
# one version (hast-* still resolve 7.1.0 without a workspace pin).
overrides:
  katex: 0.18.7
  property-information: 7.2.0
  # undici 7.29.1 (GHSA-qrxm-fqhp-jwvm / CVE-2026-87018 and the
  # Oct 2026 high set). @ai-sdk/provider-utils and @cacheable/net accept
  # ^7.29.0 / ^7.24.5. miniflare@5.20261006.1-alpha pins undici@7.29.1
  # exactly, so the 7.x line is forced to 7.30.1. undici 8.x is not
  # overridden: docula accepts ^8.10.0, and the lockfile resolves 8.12.2
  # (newest patched 8.x outside the 7-day cooldown; 8.12.3 is 2026-10-19).
  "undici@7": "7.30.1"

# Lifecycle-script exceptions — each entry is a reviewed security exception.
# esbuild: used by tsdown / the JS build.
# unrs-resolver: native resolver pulled in by the toolchain.
# workerd: Cloudflare Workers runtime pulled in by wrangler (site deploy).
# sharp: native image pipeline pulled in by wrangler.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
