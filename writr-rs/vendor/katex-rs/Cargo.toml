[package]
edition = "2024"
name = "katex-rs"
version = "0.3.0"
build = "build.rs"
publish = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A Rust implementation of KaTeX - Fast math typesetting for anywhere, more than just the web."
readme = "README.md"
keywords = [
    "latex",
    "math",
    "katex",
    "wasm",
    "parsing",
]
categories = [
    "mathematics",
    "wasm",
    "parsing",
]
license = "MIT"
repository = "https://github.com/katex-rs/katex-rs"

[features]
backtrace = []
default = []
# WRITR-RS PATCH: the wasm-bindgen API is not vendored.
wasm = []

[lib]
name = "katex"
path = "src/lib.rs"

[dependencies.bon]
version = "3.10.0"

[dependencies.phf]
version = "0.14.0"
features = ["macros"]

[dependencies.rapidhash]
version = "4.5.1"

[dependencies.strum]
version = "0.28.0"
features = ["derive"]

[dependencies.strum_macros]
version = "0.28.0"

[dependencies.thiserror]
version = "2.0.20"

[build-dependencies.phf]
version = "0.14.0"
features = ["macros"]

[build-dependencies.phf_codegen]
version = "0.14.0"

[build-dependencies.serde]
version = "1"
features = ["derive"]

[build-dependencies.serde_json]
version = "1"

[build-dependencies.unicode-normalization]
version = "0.1.25"

[lints.clippy]
absolute_paths = "warn"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
clone_on_ref_ptr = "warn"
default_numeric_fallback = "allow"
doc_markdown = "allow"
expect_used = "warn"
float_cmp = "allow"
get_unwrap = "warn"
if_then_some_else_none = "warn"
impl_trait_in_params = "warn"
indexing_slicing = "allow"
map_with_unused_argument_over_ranges = "warn"
missing_asserts_for_indexing = "warn"
missing_errors_doc = "allow"
needless_raw_strings = "warn"
non_ascii_literal = "warn"
panic = "warn"
pointer_format = "warn"
pub_use = "allow"
rc_buffer = "warn"
ref_patterns = "warn"
return_and_then = "warn"
separated_literal_suffix = "warn"
single_call_fn = "allow"
str_to_string = "warn"
string_slice = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unreadable_literal = "allow"
unused_trait_names = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"

[lints.clippy.cargo]
level = "warn"
priority = -1

[lints.clippy.nursery]
level = "warn"
priority = -1

[lints.clippy.pedantic]
level = "warn"
priority = -1
